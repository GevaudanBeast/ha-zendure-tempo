      entity_id: input_boolean.zendure_tempo_enabled
      state: "on"
    - condition: state
      entity_id: sensor.rte_tempo_couleur_actuelle
      state: "Rouge"
    - condition: state
      entity_id: binary_sensor.rte_tempo_heures_creuses
      state: "on"
  action:
    - service: number.set_value
      target:
