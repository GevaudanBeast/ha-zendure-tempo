# ============================================================================
# ZENDURE TEMPO - À coller à la fin de votre fichier automations.yaml
# ============================================================================
# PRÉREQUIS : Créer ces helpers via l'UI (Paramètres > Entrées) :
#   - input_boolean.zendure_tempo_enabled
#   - input_number.zendure_tempo_soc_rouge (80-100, défaut 100)
#   - input_number.zendure_tempo_soc_normal (70-100, défaut 90)
#   - input_number.zendure_tempo_input_limit_max (0-1200, défaut 1200)
#   - input_number.zendure_tempo_output_limit_max (0-1200, défaut 1200)
# ============================================================================

- alias: "Zendure Tempo - Rouge HP - Décharge"
  description: "Jour Rouge + HP : décharge maximale, pas de charge réseau"
  trigger:
    - platform: state
      entity_id: binary_sensor.rte_tempo_heures_creuses
      to: "off"
    - platform: state
      entity_id: sensor.rte_tempo_couleur_actuelle
      to: "Rouge"
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.zendure_tempo_enabled
      state: "on"
    - condition: state
      entity_id: sensor.rte_tempo_couleur_actuelle
      state: "Rouge"
    - condition: state
      entity_id: binary_sensor.rte_tempo_heures_creuses
      state: "off"
  action:
    - service: number.set_value
      target:
        entity_id: number.hyper_2000_input_limit
      data:
        value: 0
    - service: number.set_value
      target:
        entity_id: number.hyper_2000_output_limit
      data:
        value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
  mode: single

- alias: "Zendure Tempo - Rouge HC - Charge"
  description: "Jour Rouge + HC : charge maximale pour tenir la journée"
  trigger:
    - platform: state
      entity_id: binary_sensor.rte_tempo_heures_creuses
      to: "on"
    - platform: state
      entity_id: sensor.rte_tempo_couleur_actuelle
