# =============================================================================
# Zendure Tempo - Pilotage intelligent des batteries selon tarif RTE Tempo
# =============================================================================
#
# Ce package pilote les batteries Zendure Hyper 2000 en fonction de la couleur
# du jour Tempo et des heures creuses/pleines pour optimiser la facture.
#
# Stratégie :
# - Rouge HP : Décharge max, pas de charge réseau (électricité très chère)
# - Rouge HC : Charge max pour préparer le lendemain
# - Blanc HP : Décharge (tarif moyen)
# - Blanc HC : Mode normal
# - Bleu : Mode smart normal
# - Veille Rouge : Charge max en HC pour préparer
#
# Installation :
# 1. Copier ce fichier dans /config/packages/
# 2. Ajouter dans configuration.yaml : homeassistant: packages: !include_dir_named packages
# 3. Adapter les entity_id selon votre installation
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT BOOLEAN - Activation du pilotage Tempo
# -----------------------------------------------------------------------------
input_boolean:
  zendure_tempo_enabled:
    name: "Pilotage Tempo Zendure"
    icon: mdi:battery-clock

# -----------------------------------------------------------------------------
# INPUT NUMBER - Paramètres configurables
# -----------------------------------------------------------------------------
input_number:
  zendure_tempo_soc_rouge:
    name: "SOC cible jour Rouge"
    min: 80
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-alert
    initial: 100

  zendure_tempo_soc_normal:
    name: "SOC cible normal"
    min: 70
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery
    initial: 90

  zendure_tempo_input_limit_max:
    name: "Limite charge max"
    min: 0
    max: 1200
    step: 100
    unit_of_measurement: "W"
    icon: mdi:transmission-tower-import
    initial: 1200

  zendure_tempo_output_limit_max:
    name: "Limite décharge max"
    min: 0
    max: 1200
    step: 100
    unit_of_measurement: "W"
    icon: mdi:transmission-tower-export
    initial: 1200

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS - État calculé
# -----------------------------------------------------------------------------
template:
  - sensor:
      - name: "Zendure Tempo Mode Actuel"
        unique_id: zendure_tempo_current_mode
        state: >
          {% set enabled = is_state('input_boolean.zendure_tempo_enabled', 'on') %}
          {% if not enabled %}
            Désactivé
          {% else %}
            {% set couleur = states('sensor.rte_tempo_couleur_actuelle') | lower %}
            {% set hc = is_state('binary_sensor.rte_tempo_heures_creuses', 'on') %}
            {% set demain = states('sensor.rte_tempo_prochaine_couleur') | lower %}
            {% if couleur == 'rouge' %}
              {% if hc %}Rouge HC - Charge{% else %}Rouge HP - Décharge{% endif %}
            {% elif couleur == 'blanc' %}
              {% if hc %}Blanc HC - Normal{% else %}Blanc HP - Décharge{% endif %}
            {% elif demain == 'rouge' and hc %}
              Veille Rouge - Charge
            {% else %}
              Bleu - Normal
            {% endif %}
          {% endif %}
        icon: >
          {% set state = this.state | default('') %}
          {% if 'Décharge' in state %}
            mdi:battery-arrow-down
          {% elif 'Charge' in state %}
            mdi:battery-arrow-up
          {% else %}
            mdi:battery
          {% endif %}

# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------
automation:
  # ===========================================================================
  # JOUR ROUGE - Heures Pleines (6h-22h) : DÉCHARGE MAX
  # ===========================================================================
  - id: zendure_tempo_rouge_hp
    alias: "Zendure Tempo - Rouge HP - Décharge"
    description: "Jour Rouge + HP : décharge maximale, pas de charge réseau"
    trigger:
      # Déclenchement au passage en HP (6h)
      - platform: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        to: "off"
      # Ou si la couleur passe à rouge
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        to: "Rouge"
      # Ou au démarrage HA
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      - condition: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        state: "Rouge"
      - condition: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        state: "off"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Rouge HP - Décharge activée (input=0, output=max)"

  # ===========================================================================
  # JOUR ROUGE - Heures Creuses (22h-6h) : CHARGE MAX
  # ===========================================================================
  - id: zendure_tempo_rouge_hc
    alias: "Zendure Tempo - Rouge HC - Charge"
    description: "Jour Rouge + HC : charge maximale pour tenir la journée"
    trigger:
      - platform: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        to: "on"
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        to: "Rouge"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      - condition: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        state: "Rouge"
      - condition: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        state: "on"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: "{{ states('input_number.zendure_tempo_input_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_soc_set
        data:
          value: "{{ states('input_number.zendure_tempo_soc_rouge') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Rouge HC - Charge activée (input=max, output=0, soc=100%)"

  # ===========================================================================
  # JOUR BLANC - Heures Pleines : DÉCHARGE MODÉRÉE
  # ===========================================================================
  - id: zendure_tempo_blanc_hp
    alias: "Zendure Tempo - Blanc HP - Décharge"
    description: "Jour Blanc + HP : décharge pour économiser"
    trigger:
      - platform: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        to: "off"
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        to: "Blanc"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      - condition: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        state: "Blanc"
      - condition: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        state: "off"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Blanc HP - Décharge activée"

  # ===========================================================================
  # JOUR BLANC - Heures Creuses : NORMAL
  # ===========================================================================
  - id: zendure_tempo_blanc_hc
    alias: "Zendure Tempo - Blanc HC - Normal"
    description: "Jour Blanc + HC : mode normal"
    trigger:
      - platform: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        to: "on"
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        to: "Blanc"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      - condition: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        state: "Blanc"
      - condition: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        state: "on"
      # Ne pas activer si demain est rouge (priorité à la charge)
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.rte_tempo_prochaine_couleur
            state: "Rouge"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: "{{ states('input_number.zendure_tempo_input_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_soc_set
        data:
          value: "{{ states('input_number.zendure_tempo_soc_normal') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Blanc HC - Mode normal"

  # ===========================================================================
  # VEILLE JOUR ROUGE - Heures Creuses : CHARGE PRÉVENTIVE
  # ===========================================================================
  - id: zendure_tempo_veille_rouge
    alias: "Zendure Tempo - Veille Rouge - Charge"
    description: "Veille d'un jour Rouge en HC : charge maximale préventive"
    trigger:
      - platform: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        to: "on"
      - platform: state
        entity_id: sensor.rte_tempo_prochaine_couleur
        to: "Rouge"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      # Demain est rouge
      - condition: state
        entity_id: sensor.rte_tempo_prochaine_couleur
        state: "Rouge"
      # Aujourd'hui n'est PAS rouge (sinon l'automation rouge_hc prend le relais)
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.rte_tempo_couleur_actuelle
            state: "Rouge"
      # On est en heures creuses
      - condition: state
        entity_id: binary_sensor.rte_tempo_heures_creuses
        state: "on"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: "{{ states('input_number.zendure_tempo_input_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_soc_set
        data:
          value: "{{ states('input_number.zendure_tempo_soc_rouge') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Veille Rouge - Charge préventive activée"
      # Notification optionnelle
      - service: persistent_notification.create
        data:
          title: "⚠️ Tempo - Jour Rouge demain"
          message: "Demain est un jour ROUGE. Charge de la batterie en cours pour optimiser."

  # ===========================================================================
  # JOUR BLEU - NORMAL
  # ===========================================================================
  - id: zendure_tempo_bleu
    alias: "Zendure Tempo - Bleu - Normal"
    description: "Jour Bleu : mode smart normal"
    trigger:
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        to: "Bleu"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.zendure_tempo_enabled
        state: "on"
      - condition: state
        entity_id: sensor.rte_tempo_couleur_actuelle
        state: "Bleu"
      # Pas si demain rouge et HC (priorité charge préventive)
      - condition: not
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: sensor.rte_tempo_prochaine_couleur
                state: "Rouge"
              - condition: state
                entity_id: binary_sensor.rte_tempo_heures_creuses
                state: "on"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: "{{ states('input_number.zendure_tempo_input_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_soc_set
        data:
          value: "{{ states('input_number.zendure_tempo_soc_normal') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Bleu - Mode normal"

  # ===========================================================================
  # DÉSACTIVATION - Retour aux valeurs par défaut
  # ===========================================================================
  - id: zendure_tempo_disabled
    alias: "Zendure Tempo - Désactivé"
    description: "Retour aux valeurs normales quand le pilotage est désactivé"
    trigger:
      - platform: state
        entity_id: input_boolean.zendure_tempo_enabled
        to: "off"
    action:
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_input_limit
        data:
          value: "{{ states('input_number.zendure_tempo_input_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_output_limit
        data:
          value: "{{ states('input_number.zendure_tempo_output_limit_max') | int }}"
      - service: number.set_value
        target:
          entity_id: number.hyper_2000_soc_set
        data:
          value: "{{ states('input_number.zendure_tempo_soc_normal') | int }}"
      - service: logbook.log
        data:
          name: "Zendure Tempo"
          message: "Pilotage désactivé - Retour mode normal"
